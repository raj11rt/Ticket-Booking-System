<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Bookings - TicketFlow</title>
    <meta name="description" content="View your confirmed tickets and access entry QR codes on TicketFlow.">
    <link rel="stylesheet" href="/frontend/css/styles.css">
    <style>
        .cancelled-badge {
            background: var(--danger-bg);
            border: 1px solid var(--danger);
            color: var(--danger);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            display: inline-block;
            margin-bottom: 12px;
        }
        .confirmed-badge {
            background: var(--success-bg);
            border: 1px solid var(--success);
            color: var(--success);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            display: inline-block;
            margin-bottom: 12px;
        }
        .ticket-detail-label {
            display: block;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-muted);
            font-weight: 600;
            margin-bottom: 2px;
        }
        .ticket-detail-value {
            color: var(--text-strong);
            font-weight: 700;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <header></header>

    <div class="container" style="max-width: 780px;">
        <h1 style="margin-bottom: 8px; font-family: 'Outfit';">My Bookings</h1>
        <p style="color: var(--text-muted); margin-bottom: 40px;">View your confirmed tickets, access entry QR codes, or manage cancellations.</p>

        <div id="bookingsList" style="display:flex; flex-direction:column; gap:28px;">
            <div class="card" style="text-align: center; color: var(--text-muted); padding: 48px;">
                Loading your bookings...
            </div>
        </div>
    </div>

    <script src="/frontend/js/api.js"></script>
    <script>
        async function loadBookings() {
            const list = document.getElementById("bookingsList");
            try {
                const bookings = await api.get("/bookings");

                if (bookings.length === 0) {
                    list.innerHTML = `
                        <div class="card" style="text-align: center; color: var(--text-muted); padding: 60px;">
                            <div style="font-size: 52px; margin-bottom: 16px;">🎟️</div>
                            <h3 style="margin-bottom: 8px;">No Bookings Yet</h3>
                            <p>Book your first movie or concert ticket to get started.</p>
                            <a href="/frontend/index.html" class="btn btn-primary" style="margin-top: 20px;">Browse Events</a>
                        </div>`;
                    return;
                }

                let html = "";
                for (const b of bookings) {
                    const isCancelled = b.status === "cancelled";
                    const badgeHtml = isCancelled
                        ? `<span class="cancelled-badge">Cancelled</span>`
                        : `<span class="confirmed-badge">✓ Confirmed</span>`;

                    const seatsStr = b.seats.map(s => `${s.row_label}-${s.col_number} (${s.category})`).join(", ");

                    const actionHtml = isCancelled ? "" : `
                        <button class="btn btn-secondary" style="border-color: var(--danger); color: var(--danger); margin-top: 20px; font-size: 13px;" onclick="cancelBooking(${b.id})">
                            Cancel Booking
                        </button>`;

                    let qrImageHtml = `<div style="font-size: 40px; color: var(--text-muted);">🚫</div><span style="font-size:12px; color:var(--text-muted); margin-top:10px; display:block; text-align:center;">Ticket Cancelled</span>`;
                    if (!isCancelled) {
                        try {
                            const qrRes = await api.get(`/bookings/${b.id}/qr`);
                            qrImageHtml = `<img class="ticket-qr" src="data:image/png;base64,${qrRes.qr_base64}" alt="QR Ticket Code" style="width:140px; height:140px;" />`;
                        } catch (err) {
                            qrImageHtml = `<div style="font-size: 12px; color: var(--text-muted);">Failed to load QR</div>`;
                        }
                    }

                    html += `
                        <div class="ticket" style="${isCancelled ? 'opacity: 0.65;' : ''}">
                            <div class="ticket-left">
                                ${badgeHtml}
                                <h2 style="font-size: 22px; margin-bottom: 14px; color: var(--text-main); line-height: 1.3;">${b.event_title}</h2>
                                <div style="display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:15px;">
                                    <div>
                                        <span class="ticket-detail-label">Ref Code</span>
                                        <span class="ticket-detail-value">${b.booking_ref}</span>
                                    </div>
                                    <div>
                                        <span class="ticket-detail-label">Total Paid</span>
                                        <span class="ticket-detail-value" style="color: var(--primary);">$${b.total_amount.toFixed(2)}</span>
                                    </div>
                                    <div>
                                        <span class="ticket-detail-label">Venue</span>
                                        <span class="ticket-detail-value">${b.venue_name}</span>
                                    </div>
                                    <div>
                                        <span class="ticket-detail-label">Seats</span>
                                        <span class="ticket-detail-value" style="word-break: break-all;">${seatsStr}</span>
                                    </div>
                                    <div>
                                        <span class="ticket-detail-label">Date</span>
                                        <span class="ticket-detail-value">${b.date}</span>
                                    </div>
                                    <div>
                                        <span class="ticket-detail-label">Time</span>
                                        <span class="ticket-detail-value">${b.time}</span>
                                    </div>
                                </div>
                                ${actionHtml}
                            </div>
                            <div class="ticket-right">
                                ${qrImageHtml}
                            </div>
                        </div>
                    `;
                }

                list.innerHTML = html;
            } catch (err) {
                toast.error(err.message || "Failed to load bookings");
                list.innerHTML = `
                    <div class="card" style="text-align: center; color: var(--danger); padding: 48px;">
                        Error: ${err.message}
                    </div>`;
            }
        }

        async function cancelBooking(bookingId) {
            if (!confirm("Are you sure you want to cancel this booking? This action is irreversible and seats will be offered to waitlisted users.")) return;
            try {
                const res = await api.delete(`/bookings/${bookingId}`);
                toast.success(res.message || "Booking cancelled successfully.");
                loadBookings();
            } catch (err) {
                toast.error(err.message || "Cancellation failed");
            }
        }

        document.addEventListener("DOMContentLoaded", () => { loadBookings(); });
    </script>
</body>
</html>
