<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organiser Panel - TicketFlow</title>
    <link rel="stylesheet" href="/frontend/css/styles.css">
    <style>
        .event-list-card {
            background: white;
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 20px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 14px;
            transition: all 0.25s;
            box-shadow: 0 2px 8px rgba(109,40,217,0.04);
        }
        .event-list-card:hover {
            border-color: var(--border-hover);
            box-shadow: 0 6px 20px rgba(109,40,217,0.09);
        }
        .show-summary-row {
            background: var(--bg-inset);
            border: 1px solid var(--border-color);
            padding: 14px 18px;
            border-radius: 10px;
            margin-bottom: 12px;
        }
        .show-revenue-amount { color: var(--primary); font-weight: 700; font-size: 16px; }
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.45);
            backdrop-filter: blur(6px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .modal-content {
            background: white;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            width: 90%;
            max-width: 600px;
            max-height: 85vh;
            overflow-y: auto;
            padding: 32px;
            box-shadow: 0 24px 60px rgba(0,0,0,0.16);
            animation: fadeInUp 0.3s ease;
        }
        .total-revenue-banner {
            background: var(--success-bg);
            border: 1.5px solid var(--success);
            border-radius: 12px;
            text-align: center;
            padding: 18px;
            margin-bottom: 24px;
        }
        .total-revenue-banner h3 {
            color: var(--success);
            font-size: 26px;
        }
        .total-revenue-banner p {
            color: var(--text-muted);
            font-size: 13px;
            margin-top: 4px;
        }
    </style>
</head>
<body>
    <header></header>

    <div class="container">
        <h1 style="margin-bottom: 8px; font-family: 'Outfit';">Organiser Dashboard</h1>
        <p style="color: var(--text-muted); margin-bottom: 40px;">Manage your movie and concert events, add showtimes, and track ticket revenues.</p>

        <div style="display:grid; grid-template-columns: 2fr 1fr; gap:40px; align-items:start;">

            <!-- Left: Events List -->
            <div>
                <h2 class="section-title">Your Events</h2>
                <div id="eventsList" style="display:flex; flex-direction:column; gap:14px;">
                    <div class="card" style="text-align: center; color: var(--text-muted); padding: 40px;">
                        Loading events...
                    </div>
                </div>
            </div>

            <!-- Right: Create Panels -->
            <div style="display:flex; flex-direction:column; gap:24px;">

                <!-- Create Event -->
                <div class="card">
                    <h3 style="margin-bottom: 18px; font-size: 18px; font-family: 'Outfit';">🎬 Create New Event</h3>
                    <form id="createEventForm">
                        <div class="form-group">
                            <label for="eventTitle">Event Title</label>
                            <input type="text" id="eventTitle" class="form-control" placeholder="e.g. Inception Movie Screening" required>
                        </div>
                        <div class="form-group">
                            <label for="eventType">Event Type</label>
                            <select id="eventType" class="form-control">
                                <option value="movie">Movie</option>
                                <option value="concert">Concert</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="eventDescription">Description</label>
                            <textarea id="eventDescription" class="form-control" placeholder="Brief description..." rows="3"></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 10px;">
                            Create Event
                        </button>
                    </form>
                </div>

                <!-- Add Showtime -->
                <div class="card">
                    <h3 style="margin-bottom: 18px; font-size: 18px; font-family: 'Outfit';">🗓️ Add Show / Showtime</h3>
                    <form id="createShowForm">
                        <div class="form-group">
                            <label for="showEvent">Select Event</label>
                            <select id="showEvent" class="form-control" required>
                                <option value="">-- Choose Event --</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="showVenue">Select Venue</label>
                            <select id="showVenue" class="form-control" required onchange="handleVenueChange()">
                                <option value="">-- Choose Venue --</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="showDate">Show Date</label>
                            <input type="date" id="showDate" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label for="showTime">Show Time</label>
                            <input type="time" id="showTime" class="form-control" required>
                        </div>

                        <div id="pricingConfigSection" style="margin-top:16px; display:none; border-top:1px solid var(--border-color); padding-top:16px;">
                            <label style="display:block; color:var(--text-muted); font-size:11px; margin-bottom:10px; font-weight:700; text-transform:uppercase; letter-spacing:1px;">
                                Ticket Pricing per Category
                            </label>
                            <div id="pricingInputs" style="display:flex; flex-direction:column; gap:10px; margin-bottom:16px;">
                            </div>
                        </div>

                        <button type="submit" class="btn btn-accent" style="width: 100%; justify-content: center; padding: 10px;">
                            Add Showtime
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Revenue Modal -->
    <div id="revenueModal" class="modal-overlay">
        <div class="modal-content">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:22px;">
                <h2 id="modalEventTitle" style="font-size: 20px; color: var(--text-main);">Revenue Summary</h2>
                <button style="background:none; border:none; color:var(--text-muted); font-size:22px; cursor:pointer; line-height:1;" onclick="closeRevenueModal()">✕</button>
            </div>
            <div id="modalContent"></div>
        </div>
    </div>

    <script src="/frontend/js/api.js"></script>
    <script>
        let myEvents = [];
        let venues = [];

        async function initDashboard() {
            const role = api.getUserRole();
            if (role !== "organiser") {
                toast.error("Access denied. Organiser credentials required.");
                setTimeout(() => { window.location.href = "/frontend/index.html"; }, 1500);
                return;
            }
            await loadEvents();
            await loadVenues();
        }

        async function loadEvents() {
            const list = document.getElementById("eventsList");
            const showEventSelect = document.getElementById("showEvent");
            try {
                const data = await api.get("/organiser/events");
                myEvents = data;
                showEventSelect.innerHTML = `<option value="">-- Choose Event --</option>` +
                    myEvents.map(e => `<option value="${e.id}">${e.title}</option>`).join("");

                if (myEvents.length === 0) {
                    list.innerHTML = `<div class="card" style="text-align: center; color: var(--text-muted); padding: 48px;">You have not created any events yet.</div>`;
                    return;
                }

                list.innerHTML = myEvents.map(e => `
                    <div class="event-list-card">
                        <div>
                            <span class="event-tag ${e.type}" style="position:static; display:inline-block; margin-bottom:8px;">${e.type}</span>
                            <h3 style="font-size: 16px; color: var(--text-main);">${e.title}</h3>
                        </div>
                        <div style="display:flex; gap:8px; flex-wrap:wrap;">
                            <button class="btn btn-secondary" onclick="viewRevenueSummary(${e.id})" style="font-size:13px; padding:8px 14px;">📊 Revenue</button>
                            <a href="/frontend/pages/event-detail.html?id=${e.id}" class="btn btn-primary" style="font-size:13px; padding:8px 14px;">View Shows</a>
                        </div>
                    </div>`).join("");
            } catch (err) {
                toast.error("Failed to load events: " + err.message);
            }
        }

        async function loadVenues() {
            const select = document.getElementById("showVenue");
            try {
                const data = await api.get("/venues");
                venues = data;
                select.innerHTML = `<option value="">-- Choose Venue --</option>` +
                    venues.map(v => `<option value="${v.id}">${v.name}</option>`).join("");
            } catch (err) { console.error("Error loading venues:", err); }
        }

        async function handleVenueChange() {
            const venueId = document.getElementById("showVenue").value;
            const pricingSection = document.getElementById("pricingConfigSection");
            const inputsDiv = document.getElementById("pricingInputs");
            if (!venueId) { pricingSection.style.display = "none"; return; }
            try {
                const seats = await api.get(`/venues/${venueId}/seats`);
                const categories = [...new Set(seats.map(s => s.category))];
                inputsDiv.innerHTML = categories.map(cat => `
                    <div style="display:flex; justify-content:space-between; align-items:center; gap:15px;">
                        <span style="font-size:14px; font-weight:600; color:var(--text-main);">${cat} ($)</span>
                        <input type="number" step="0.01" class="form-control price-input" data-category="${cat}" placeholder="e.g. 150" required style="width:130px;">
                    </div>`).join("");
                pricingSection.style.display = "block";
            } catch (err) { toast.error("Error loading venue seats: " + err.message); }
        }

        document.getElementById("createEventForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const title = document.getElementById("eventTitle").value;
            const type = document.getElementById("eventType").value;
            const description = document.getElementById("eventDescription").value;
            try {
                await api.post("/events", { title, type, description });
                toast.success("Event created successfully!");
                document.getElementById("createEventForm").reset();
                loadEvents();
            } catch (err) { toast.error(err.message); }
        });

        document.getElementById("createShowForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const eventId = document.getElementById("showEvent").value;
            const venueId = parseInt(document.getElementById("showVenue").value);
            const date = document.getElementById("showDate").value;
            const time = document.getElementById("showTime").value;
            const pricing = {};
            document.querySelectorAll(".price-input").forEach(input => {
                pricing[input.getAttribute("data-category")] = parseFloat(input.value);
            });
            try {
                await api.post(`/events/${eventId}/shows`, { venue_id: venueId, date, time, pricing });
                toast.success("Show scheduled successfully!");
                document.getElementById("createShowForm").reset();
                document.getElementById("pricingConfigSection").style.display = "none";
            } catch (err) { toast.error(err.message); }
        });

        async function viewRevenueSummary(eventId) {
            const modal = document.getElementById("revenueModal");
            const modalContent = document.getElementById("modalContent");
            const modalTitle = document.getElementById("modalEventTitle");
            modal.style.display = "flex";
            modalContent.innerHTML = `<div style="text-align:center; color:var(--text-muted); padding:30px;">Loading revenue details...</div>`;
            try {
                const summary = await api.get(`/organiser/events/${eventId}/summary`);
                modalTitle.innerText = summary.title;

                if (summary.shows.length === 0) {
                    modalContent.innerHTML = `<div style="text-align:center; color:var(--text-muted); padding:30px;">No shows have been scheduled for this event.</div>`;
                    return;
                }

                const showsHtml = summary.shows.map(s => {
                    const pctSold = s.capacity > 0 ? Math.round((s.total_tickets_sold / s.capacity) * 100) : 0;
                    return `
                        <div class="show-summary-row">
                            <div style="display:flex; justify-content:space-between; margin-bottom:6px; align-items:center;">
                                <strong style="color:var(--text-main); font-size:15px;">🏛️ ${s.venue_name}</strong>
                                <span class="show-revenue-amount">$${s.revenue.toFixed(2)}</span>
                            </div>
                            <div style="display:flex; justify-content:space-between; font-size:13px; color:var(--text-muted);">
                                <span>📅 ${s.date} &nbsp;⏰ ${s.time}</span>
                                <span>Sold: <strong style="color:var(--text-main);">${s.total_tickets_sold}/${s.capacity}</strong> (${pctSold}%)</span>
                            </div>
                        </div>`;
                }).join("");

                modalContent.innerHTML = `
                    <div class="total-revenue-banner">
                        <h3>$${summary.total_revenue.toFixed(2)}</h3>
                        <p>Total Event Revenue</p>
                    </div>
                    <h4 style="margin-bottom:14px; color:var(--text-muted); font-size:12px; text-transform:uppercase; letter-spacing:1px;">Show Breakdown</h4>
                    ${showsHtml}`;
            } catch (err) {
                toast.error("Failed to load revenue summary: " + err.message);
                closeRevenueModal();
            }
        }

        function closeRevenueModal() {
            document.getElementById("revenueModal").style.display = "none";
        }

        document.addEventListener("DOMContentLoaded", () => { initDashboard(); });
    </script>
</body>
</html>
